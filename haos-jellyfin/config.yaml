name: "Jellyfin Media Server"
version: "12.0.6"
slug: "haos-jellyfin"
description: "Jellyfin is a free software media system with full hardware acceleration support."
url: "https://github.com/thcuba/haos-jellyfin"
arch:
  - amd64
  - aarch64
map:
  - media:rw
  - share:rw
devices:
  - /dev/dri
  - /dev/dri/renderD128
  - /dev/shm
  # NVIDIA passthrough (requires NVIDIA proprietary driver + container toolkit on the host)
  - /dev/nvidiactl
  - /dev/nvidia0
  - /dev/nvidia-modeset
  - /dev/nvidia-uvm
  - /dev/nvidia-uvm-tools
video: true
environment:
  # VA-API driver is auto-detected by libva (iHD on Intel, radeonsi on AMD,
  # none on ARM). Do NOT force iHD: it breaks AMD and aarch64 transcoding.
  # Persist Jellyfin config/data/cache/log on HAOS `/share` (mapped share:rw)
  # so library, users, and settings survive restarts, updates, and re-installs.
  # The Dockerfile overrides the base image ENTRYPOINT so these are honored.
  JELLYFIN_CONFIG_DIR: /share/jellyfin/config
  JELLYFIN_DATA_DIR: /share/jellyfin/data
  JELLYFIN_CACHE_DIR: /share/jellyfin/cache
  JELLYFIN_LOG_DIR: /share/jellyfin/log
webui: "http://[HOST]:[PORT:8096]"
init: false
image: "ghcr.io/thcuba/haos-jellyfin-{arch}"
ports:
  8096/tcp: 8096
