name: Dockerfile & Config Lint
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run hadolint on Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: haos-jellyfin/Dockerfile
          failure-threshold: warning

  lint-yaml:
    name: Lint YAML config files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository.yaml and config.yaml
        run: |
          yq eval . repository.yaml > /dev/null || { echo "repository.yaml non valido"; exit 1; }
          yq eval . haos-jellyfin/config.yaml > /dev/null || { echo "config.yaml non valido"; exit 1; }
          echo "Tutti i file YAML sono validi"

      - name: Validate version consistency
        run: |
          REPO_VER=$(yq -r '.version // "?"' repository.yaml)
          CONF_VER=$(yq -r '.version // "?"' haos-jellyfin/config.yaml)
          echo "repository.yaml version: $REPO_VER"
          echo "config.yaml version: $CONF_VER"
          if [ "$REPO_VER" != "$CONF_VER" ]; then
            echo "ERRORE: versioni non corrispondenti tra repository.yaml ($REPO_VER) e config.yaml ($CONF_VER)"
            exit 1
          fi
          echo "Versioni consistenti: $REPO_VER"

  lint-python:
    name: Lint Python scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m py_compile bump_version.py
          shellcheck bump_version || true  # shellcheck non blocca, solo avviso
          echo "Python syntax OK"