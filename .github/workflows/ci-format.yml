name: Dockerfile & Config Lint
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run hadolint on Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: haos-jellyfin/Dockerfile
          failure-threshold: error

  lint-yaml:
    name: Lint YAML config files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository.yaml and config.yaml
        run: |
          yq eval . repository.yaml > /dev/null || { echo "repository.yaml non valido"; exit 1; }
          yq eval . haos-jellyfin/config.yaml > /dev/null || { echo "config.yaml non valido"; exit 1; }
          echo "Tutti i file YAML sono validi"

      - name: Validate config.yaml has a version
        run: |
          VER=$(yq -r '.version // ""' haos-jellyfin/config.yaml)
          if [ -z "$VER" ]; then
            echo "ERRORE: haos-jellyfin/config.yaml non ha un campo 'version'"
            exit 1
          fi
          echo "Versione addon: $VER"
          # Verifica formato semver (x.y.z)
          if ! echo "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERRORE: versione '$VER' non segue il formato semver (x.y.z)"
            exit 1
          fi
          echo "Formato versione valido"

  lint-python:
    name: Lint Python scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m py_compile bump_version.py
          shellcheck bump_version || true  # shellcheck non blocca, solo avviso
          echo "Python syntax OK"