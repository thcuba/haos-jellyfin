name: Docker Image Smoke Test
on:
  push:
    branches: [ master ]
  # Esegue solo su push a master, non su PR (troppo pesante)
  workflow_dispatch:

jobs:
  smoke-test:
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./haos-jellyfin
          load: true  # Carica immagine in locale (no push)
          tags: haos-jellyfin:test

      - name: Inspect image metadata
        run: |
          docker image inspect haos-jellyfin:test --format '{{.Size}}' | awk '{printf "Dimensione immagine: %.2f MB\n", $1/1024/1024}'
          echo "Architettura: $(docker inspect haos-jellyfin:test --format '{{.Os}}/{{.Architecture}}')"
          echo "Entrypoint: $(docker inspect haos-jellyfin:test --format '{{json .Config.Entrypoint}}')"

      - name: Start container and test health
        run: |
          docker run -d --name jellyfin-test \
            --init \
            -p 8096:8096 \
            -e PUID=1000 \
            -e PGID=1000 \
            haos-jellyfin:test

          echo "Container avviato, aspetto 30s per l'avvio del server..."
          sleep 30

          # Healthcheck HTTP all'API pubblica di Jellyfin
          curl -sf --retry 5 --retry-delay 10 http://localhost:8096/System/Info/Public || {
            echo "Health check fallito. Log del container:"
            docker logs jellyfin-test --tail 40
            docker stop jellyfin-test && docker rm jellyfin-test
            exit 1
          }

          echo "Health check passato! Jellyfin risponde correttamente."

      - name: Cleanup
        if: always()
        run: |
          docker stop jellyfin-test 2>/dev/null || true
          docker rm jellyfin-test 2>/dev/null || true
          docker rmi haos-jellyfin:test 2>/dev/null || true